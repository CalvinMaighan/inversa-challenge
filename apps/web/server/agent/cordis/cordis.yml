# Everglades Ops agent spine, ported from deedee's cordis.yml.
# No coding-agent rows (bash/fs/sandbox/subagent), no session persistence:
# every turn runs on a fresh in-process session seeded with the transcript.
- id: timer
  name: "@deepseek-ai/cordis-plugin-timer"

- id: llm
  name: "@deepseek-ai/dsh-llm"

- id: session
  name: "@deepseek-ai/dsh-session"

- id: agent
  name: "@deepseek-ai/dsh-agent"

# GPT-6 Luna on OpenRouter's OpenAI-compatible endpoint (OPENROUTER_API_KEY).
# The only model the agent runs. There is no escalation row.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openrouter
    model: openai/gpt-6-luna

- id: llm-retry
  name: "@deepseek-ai/dsh-llm-retry"

- id: settings
  name: "@deepseek-ai/dsh-settings-file"

- id: credentials
  name: "@deepseek-ai/dsh-credentials-local"

- id: token-meter
  name: "@deepseek-ai/dsh-token-meter"

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"

# Large GraphQL results (sightings, readings) get head/tail pruned in context.
- id: compaction-tool-result-pruner
  name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: tools
  name: "@deepseek-ai/dsh-tools"

- id: system-prompt
  name: "@deepseek-ai/dsh-system-prompt"
  config:
    persona: ""

- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
