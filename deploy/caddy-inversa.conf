# Drop-in for the stock caddy.service, installed by remote-unpack.sh as
# /etc/systemd/system/caddy.service.d/inversa.conf. It hands Caddy the one setting the
# Caddyfile reads from the environment (SIGNAL_WORKER_URL) and none of the secrets in
# /etc/inversa/env. The leading "-" keeps Caddy starting when the file is absent.
[Service]
EnvironmentFile=-/etc/inversa/caddy.env
