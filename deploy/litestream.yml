# Litestream 0.5: continuous replication of each app's two SQLite databases to Cloudflare R2.
# Used by inversa-litestream.service (replicate) and deploy/restore.sh (restore).
# Credentials come from /etc/inversa/env (rendered from Doppler inversa/prd):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# The databases must stay in WAL mode (the API sets journal_mode = wal).

# Replica defaults, inherited by every replica below.
bucket: inversa-litestream
endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
region: auto
force-path-style: true
access-key-id: ${R2_ACCESS_KEY_ID}
secret-access-key: ${R2_SECRET_ACCESS_KEY}
sync-interval: 1s

# In 0.5, retention is a snapshot setting: a daily snapshot, kept for 7 days, bounds
# the point-in-time restore window. (A per-replica "retention" key is silently ignored.)
snapshot:
  interval: 24h
  retention: 168h

# One pair per app, matching the API's <INVERSA_DATA_DIR>/<app>/{observations,team}.db layout
# (PLAN.md C-A1). Replica paths are <app>/<db>. The pre-pivot replicas at "observations" and
# "team" (python, single-app) are no longer written; see deploy/README.md "Multi-app migration".
dbs:
  - path: /var/lib/inversa/carp/observations.db
    replica:
      type: s3
      path: carp/observations

  - path: /var/lib/inversa/carp/team.db
    replica:
      type: s3
      path: carp/team

  - path: /var/lib/inversa/lionfish/observations.db
    replica:
      type: s3
      path: lionfish/observations

  - path: /var/lib/inversa/lionfish/team.db
    replica:
      type: s3
      path: lionfish/team

  - path: /var/lib/inversa/python/observations.db
    replica:
      type: s3
      path: python/observations

  - path: /var/lib/inversa/python/team.db
    replica:
      type: s3
      path: python/team
