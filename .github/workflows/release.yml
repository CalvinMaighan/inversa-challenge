name: release

# Build the release on GitHub-hosted runners: the Axum binary (native cargo build on
# ubuntu-24.04, same glibc as the Hetzner VM) and the Next standalone tree, packed
# with deploy/ into one archive. Every merge to main (or a manual run) publishes it as a
# GitHub Release named v0.1.<run number>; deploy.yml ships a release you pick by that
# version to the VM. Nothing compiles on the host.
# Secret: DOPPLER_TOKEN (Doppler service token, project inversa, config prd), used
# only to inline NEXT_PUBLIC_CESIUM_ION_TOKEN into the client bundle.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo build --release --locked --manifest-path api/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: inversa-api
          path: api/target/release/inversa-api
          if-no-files-found: error
          retention-days: 1

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            apps/web/.next/cache
          key: web-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            web-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            web-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: dopplerhq/cli-action@v3
      - name: Build Next standalone
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOPPLER_TOKEN" || { echo "::error::DOPPLER_TOKEN secret is not set"; exit 1; }
          # NEXT_PUBLIC_* values are inlined at build time. Only these leave Doppler here. The Doppler names are the
          # NEXT_PUBLIC_ ones (the same names the dev supervisor passes); the older CESIUM_ION_TOKEN is still accepted.
          NEXT_PUBLIC_CESIUM_ION_TOKEN="$(doppler secrets get NEXT_PUBLIC_CESIUM_ION_TOKEN --plain --project inversa --config prd 2>/dev/null || doppler secrets get CESIUM_ION_TOKEN --plain --project inversa --config prd 2>/dev/null || true)"
          test -n "$NEXT_PUBLIC_CESIUM_ION_TOKEN" || { echo "::error::NEXT_PUBLIC_CESIUM_ION_TOKEN (or CESIUM_ION_TOKEN) is empty in Doppler inversa/prd"; exit 1; }
          echo "::add-mask::$NEXT_PUBLIC_CESIUM_ION_TOKEN"
          export NEXT_PUBLIC_CESIUM_ION_TOKEN
          # Google Photorealistic 3D (restrict this key by domain in Google's console: it ships in the bundle).
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$(doppler secrets get NEXT_PUBLIC_GOOGLE_MAPS_API_KEY --plain --project inversa --config prd 2>/dev/null || true)"
          if [ -n "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::add-mask::$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY"
            export NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
          fi
          # Same origin for the board's signal Worker: Caddy proxies /signal/* to it (deploy/Caddyfile).
          # Unset, the client would fall back to the dev Worker at 127.0.0.1:8799.
          export NEXT_PUBLIC_SIGNAL_URL=/signal
          # The production bundle must not carry the e2e diagnostics hook.
          unset NEXT_PUBLIC_INVERSA_E2E
          bun run --cwd apps/web build
      - name: Pack web tree
        run: |
          set -euo pipefail
          S=apps/web/.next/standalone
          test -f "$S/apps/web/server.js" || { echo "::error::no standalone server.js; is output: standalone set?"; exit 1; }
          rm -f "$S"/.env "$S"/.env.* "$S"/apps/web/.env "$S"/apps/web/.env.*
          rm -rf "$S/apps/web/.next/cache"
          mkdir -p "$S/apps/web/.next"
          cp -a apps/web/.next/static "$S/apps/web/.next/static"
          if [ -d apps/web/public ]; then
            mkdir -p "$S/apps/web/public"
            cp -a apps/web/public/. "$S/apps/web/public/"
          fi
          tar --zstd -C "$S" -cf inversa-web.tar.zst .
      - uses: actions/upload-artifact@v4
        with:
          name: inversa-web
          path: inversa-web.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package:
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job writes: it publishes the GitHub Release (and its tag).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inversa-api
          path: ${{ runner.temp }}/api
      - uses: actions/download-artifact@v4
        with:
          name: inversa-web
          path: ${{ runner.temp }}/web
      - name: Pack release
        run: |
          set -euo pipefail
          # One number per run of this workflow: v0.1.1, v0.1.2, ... Deploy picks one of these.
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST/api" "$DIST/web" "$DIST/deploy" out
          install -m 755 "$RUNNER_TEMP/api/inversa-api" "$DIST/api/inversa-api"
          tar --zstd -xf "$RUNNER_TEMP/web/inversa-web.tar.zst" -C "$DIST/web"
          cp deploy/Caddyfile deploy/litestream.yml deploy/*.service deploy/caddy-inversa.conf "$DIST/deploy/"
          install -m 755 deploy/restore.sh deploy/remote-unpack.sh deploy/migrate-app-dirs.sh "$DIST/deploy/"
          jq -n --arg version "$VERSION" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" '{version: $version, sha: $sha, ref: $ref, run_id: $run}' \
            | tee "$DIST/release.json" out/release.json
          tar --zstd -C "$DIST" -cf out/inversa.tar.zst .
          (cd out && sha256sum inversa.tar.zst > SHA256SUMS)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" out/inversa.tar.zst out/SHA256SUMS out/release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Built from ${GITHUB_SHA::7} (release run $GITHUB_RUN_ID). Deploy it: Actions, deploy, Run workflow, version $VERSION."
          echo "Release \`$VERSION\` is published. Deploy it from Actions, deploy, with version \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
