"""RFC 3339 timestamp."""
scalar Time
"""Arbitrary JSON value."""
scalar JSON

input BBox {
  west: Float!
  south: Float!
  east: Float!
  north: Float!
}

enum FeedMode { PUSH POLL }
enum FeedHealth { NOMINAL LAGGING STALE DOWN }
enum Quality { RESEARCH NEEDS_ID CASUAL CURATED }
enum Param { LST_C AIR_C WATER_C SST_C RAIN_MM STAGE_M WAVE_M WIND_MS FIRE_FRP }
enum ReadingOrigin { MEASURED SATELLITE MODELED }
enum ReadingFlag { OK CLOUD BAD_DQF MISSING }

type FeedState {
  source: String!
  mode: FeedMode!
  state: FeedHealth!
  newestObservedAt: Time
  lastFetchAt: Time
  """`fetch_runs.id` of the latest run; cite it as `fetch:<id>`."""
  lastFetchRunId: ID
  lagSeconds: Int
  note: String
}

type Taxon {
  id: ID!
  scientificName: String!
  commonName: String!
  focus: Boolean!
  """iNaturalist taxon id (T44); null for taxa only GBIF or NAS have reported."""
  inatTaxonId: ID
  """Reptilia, Amphibia, Aves, Mammalia, Actinopterygii, Mollusca, Insecta, Arachnida, Plantae, Fungi or other."""
  iconicGroup: String
  """Plain text, at most two sentences, from the taxon's Wikipedia summary."""
  summary: String
  """Same-origin copy of the taxon's default photo (`/v1/media/taxon/<id>`)."""
  photoUrl: String
  """The taxon's page at iNaturalist, for a new-tab link."""
  pageUrl: String
}

"""Distinct sightings of one taxon in a window (T44)."""
type SpeciesCount {
  taxon: Taxon!
  count: Int!
  """The newest sighting counted, citable as `sighting:<id>`."""
  latestSightingId: ID
}

type Sighting {
  id: ID!
  source: String!
  extId: String!
  taxon: Taxon!
  lat: Float!
  lon: Float!
  accuracyM: Float
  observedAt: Time!
  quality: Quality!
  photoUrl: String
  canonicalId: ID
  conflict: Boolean!
}

type Station {
  id: ID!
  source: String!
  name: String!
  lat: Float!
  lon: Float!
  kind: String!
}

type Reading {
  station: Station!
  param: Param!
  value: Float
  flag: ReadingFlag!
  observedAt: Time!
  origin: ReadingOrigin!
}

type Alert {
  id: ID!
  event: String!
  severity: String!
  headline: String
  areaGeojson: JSON
  onset: Time
  expires: Time
}

type FrameChunk {
  from: Time!
  to: Time!
  stepMinutes: Int!
  frameCount: Int!
  """Base64 of EVF2 (PLAN.md C4), at most 24 frames. Bulk frames: GET /v1/frames."""
  data: String!
}

type HotspotCell {
  cell: ID!
  lat: Float!
  lon: Float!
  score: Float!
}

type HotspotGrid {
  species: ID!
  at: Time!
  cells: [HotspotCell!]!
}

type HotspotTerm {
  name: String!
  value: Float!
  rationale: String!
}

type HotspotExplain {
  cell: ID!
  species: ID!
  at: Time!
  score: Float!
  terms: [HotspotTerm!]!
}

type BacktestDay {
  day: Time!
  sightings: Int!
  hits: Int!
}

type Backtest {
  species: ID!
  days: Int!
  hitRate: Float!
  baseline: Float!
  perDay: [BacktestDay!]!
}

type EvidenceLink {
  id: ID!
  relation: String!
  source: String!
}

type Evidence {
  id: ID!
  kind: String!
  record: JSON!
  raw: JSON
  rawKey: String
  sourceUrl: String
  """Publisher web page for this record, for a new-tab link (PLAN.md C19). Null when none exists."""
  sourcePageUrl: String
  fetchedAt: Time
  ingestLagSeconds: Int
  feed: FeedState
  links: [EvidenceLink!]!
}

type Op {
  seq: Int!
  id: ID!
  hlc: String!
  boardId: ID!
  entity: String!
  entityId: ID!
  field: String!
  value: JSON
  nodeId: String!
}

input OpInput {
  id: ID!
  hlc: String!
  entity: String!
  entityId: ID!
  field: String!
  value: JSON
  nodeId: String!
}

type ApplyResult {
  applied: Int!
  duplicates: Int!
  lastSeq: Int!
}

type Mission {
  id: ID!
  fields: JSON!
}

type Message {
  id: ID!
  body: String!
  hlc: String!
  nodeId: String!
}

type Board {
  id: ID!
  lastSeq: Int!
  missions: [Mission!]!
  notes: [Mission!]!
  messages: [Message!]!
  removals: JSON!
}

type FrameRange {
  from: Time!
  to: Time!
}

type Query {
  feeds: [FeedState!]!
  sightings(bbox: BBox!, from: Time!, to: Time!, taxa: [ID!], quality: [Quality!]): [Sighting!]!
  """Taxa by id (or focus species name) and/or by a name fragment; at most 500."""
  taxa(ids: [ID!], q: String): [Taxon!]!
  """Top taxa by distinct sightings in a window, optionally limited to iconic groups; `top` defaults to 50."""
  speciesCounts(bbox: BBox!, from: Time!, to: Time!, groups: [String!], top: Int): [SpeciesCount!]!
  readings(bbox: BBox!, from: Time!, to: Time!, params: [Param!]): [Reading!]!
  alerts(bbox: BBox!, at: Time!): [Alert!]!
  frames(from: Time!, to: Time!, stepMinutes: Int!): FrameChunk!
  hotspots(species: ID!, at: Time!, bbox: BBox!, top: Int): HotspotGrid!
  explainCell(cell: ID!, species: ID!, at: Time!): HotspotExplain!
  backtest(species: ID!, days: Int!): Backtest!
  evidence(id: ID!): Evidence!
  board(id: ID!): Board!
  opsSince(boardId: ID!, seq: Int!): [Op!]!
}

type Mutation {
  applyOps(boardId: ID!, ops: [OpInput!]!): ApplyResult!
}

type Subscription {
  feeds: FeedState!
  framesUpdated: FrameRange!
  ops(boardId: ID!, afterSeq: Int!): Op!
}
