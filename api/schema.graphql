"""RFC 3339 timestamp."""
scalar Time
"""Arbitrary JSON value."""
scalar JSON

input BBox {
  west: Float!
  south: Float!
  east: Float!
  north: Float!
}

enum FeedMode { PUSH POLL }
enum FeedHealth { NOMINAL LAGGING STALE DOWN }
enum Quality { RESEARCH NEEDS_ID CASUAL CURATED }
enum Param { LST_C AIR_C WATER_C SST_C RAIN_MM STAGE_M WAVE_M WIND_MS FIRE_FRP SST SST_ANOMALY DHW BAA WAVE_PERIOD_S CURRENT_MS CURRENT_DIR_DEG }
enum ReadingOrigin { MEASURED SATELLITE MODELED }
enum ReadingFlag { OK CLOUD BAD_DQF MISSING }

type FeedState {
  source: String!
  mode: FeedMode!
  state: FeedHealth!
  newestObservedAt: Time
  lastFetchAt: Time
  """`fetch_runs.id` of the latest run; cite it as `fetch:<id>`."""
  lastFetchRunId: ID
  lagSeconds: Int
  note: String
}

type Taxon {
  id: ID!
  scientificName: String!
  commonName: String!
  focus: Boolean!
  """iNaturalist taxon id (T44); null for taxa only GBIF or NAS have reported."""
  inatTaxonId: ID
  """Reptilia, Amphibia, Aves, Mammalia, Actinopterygii, Mollusca, Insecta, Arachnida, Plantae, Fungi or other."""
  iconicGroup: String
  """Plain text, at most two sentences, from the taxon's Wikipedia summary."""
  summary: String
  """Same-origin copy of the taxon's default photo (`/v1/media/taxon/<id>`)."""
  photoUrl: String
  """The taxon's page at iNaturalist, for a new-tab link."""
  pageUrl: String
  """iNat ancestor taxon ids, root first; the web app derives the category (snakes, lizards, ...). Null when unknown."""
  ancestorIds: [ID!]
}

"""Distinct sightings of one taxon in a window (T44)."""
type SpeciesCount {
  taxon: Taxon!
  count: Int!
  """The newest sighting counted, citable as `sighting:<id>`."""
  latestSightingId: ID
}

type Sighting {
  id: ID!
  source: String!
  extId: String!
  taxon: Taxon!
  lat: Float!
  lon: Float!
  accuracyM: Float
  observedAt: Time!
  quality: Quality!
  photoUrl: String
  canonicalId: ID
  conflict: Boolean!
  """
  When the record was first stored. `ingestedAt - observedAt` is its ingest lag; over 24 h
  the record is late (frame flag 4).
  """
  ingestedAt: Time!
}

type Station {
  id: ID!
  source: String!
  name: String!
  lat: Float!
  lon: Float!
  kind: String!
}

type Reading {
  station: Station!
  param: Param!
  value: Float
  flag: ReadingFlag!
  observedAt: Time!
  origin: ReadingOrigin!
}

type Alert {
  id: ID!
  event: String!
  severity: String!
  headline: String
  areaGeojson: JSON
  onset: Time
  expires: Time
}

type FrameChunk {
  from: Time!
  to: Time!
  stepMinutes: Int!
  frameCount: Int!
  """Base64 of EVF2 (PLAN.md C4), at most 24 frames. Bulk frames: GET /v1/frames."""
  data: String!
}

type HotspotCell {
  cell: ID!
  lat: Float!
  lon: Float!
  score: Float!
}

type HotspotGrid {
  species: ID!
  at: Time!
  cells: [HotspotCell!]!
}

type HotspotTerm {
  name: String!
  value: Float!
  rationale: String!
}

type HotspotExplain {
  cell: ID!
  species: ID!
  at: Time!
  score: Float!
  terms: [HotspotTerm!]!
}

type BacktestDay {
  day: Time!
  sightings: Int!
  hits: Int!
}

type Backtest {
  species: ID!
  days: Int!
  hitRate: Float!
  baseline: Float!
  perDay: [BacktestDay!]!
}

type EvidenceLink {
  id: ID!
  relation: String!
  source: String!
}

type Evidence {
  id: ID!
  kind: String!
  record: JSON!
  raw: JSON
  rawKey: String
  sourceUrl: String
  """Publisher web page for this record, for a new-tab link (PLAN.md C19). Null when none exists."""
  sourcePageUrl: String
  fetchedAt: Time
  ingestLagSeconds: Int
  feed: FeedState
  links: [EvidenceLink!]!
}

type Op {
  seq: Int!
  id: ID!
  hlc: String!
  boardId: ID!
  entity: String!
  entityId: ID!
  field: String!
  value: JSON
  nodeId: String!
}

input OpInput {
  id: ID!
  hlc: String!
  entity: String!
  entityId: ID!
  field: String!
  value: JSON
  nodeId: String!
}

type ApplyResult {
  applied: Int!
  duplicates: Int!
  lastSeq: Int!
}

type Mission {
  id: ID!
  fields: JSON!
}

type Message {
  id: ID!
  body: String!
  hlc: String!
  nodeId: String!
}

type Board {
  id: ID!
  lastSeq: Int!
  missions: [Mission!]!
  notes: [Mission!]!
  messages: [Message!]!
  removals: JSON!
}

type FrameRange {
  from: Time!
  to: Time!
}

# ---------------------------------------------------------------------------------------------
# Forecast store (C3): `forecasts`, `forecastVerify`, `siteStatusAt`. Conditions apps only; a
# species app answers with error code NOT_CONDITIONS_APP. Sites are NWPS ids of configured
# locations (`locations[].nwps`); an unknown one is UNKNOWN_SITE. Stage is NWPS feet, flow kcfs.
# ---------------------------------------------------------------------------------------------

"""NWPS flood category, from NWPS stage thresholds only ("at or above")."""
enum FloodCategory { NONE ACTION MINOR MODERATE MAJOR }
"""
NWPS_LIVE rows were captured by this process (as-of views gate them by ingestion time);
IEM_ARCHIVE rows were backfilled from the Iowa Environmental Mesonet HML archive (gated by
issuance time only); NWS_GRIDPOINT rows come from api.weather.gov.
"""
enum ForecastSource { NWPS_LIVE IEM_ARCHIVE NWS_GRIDPOINT }
"""
Age band at the as-of time. Observations: FRESH <= 2 h, AGING <= 6 h, else STALE.
Forecasts: FRESH <= 24 h since issuance, AGING <= 36 h, else STALE. MISSING: nothing known.
"""
enum Freshness { FRESH AGING STALE MISSING }

type FloodThresholds {
  actionFt: Float
  minorFt: Float
  moderateFt: Float
  majorFt: Float
}

type ForecastPoint {
  validAt: Time!
  stageFt: Float
  flowKcfs: Float
  """Null when the stage or the site's thresholds were unknown when stored."""
  category: FloodCategory
}

"""One forecast issuance as stored. Cite as `forecast:<id>`."""
type ForecastSnapshot {
  id: ID!
  site: ID!
  """`stageflow` (NWPS API), `hml` (IEM archive), ..."""
  product: String!
  issuedAt: Time!
  ingestedAt: Time!
  source: ForecastSource!
  payloadHash: String!
  """0 for the first payload of an issuance; a changed payload with the same issuedAt is 1, 2, ... (all kept)."""
  revision: Int!
  validFrom: Time
  validTo: Time
  horizonEnd: Time
  peakStageFt: Float
  peakAt: Time
  peakCategory: FloodCategory
  points: [ForecastPoint!]!
}

"""What was known about a site's forecast at `asOf`."""
type ForecastView {
  site: ID!
  asOf: Time!
  """The forecast in force at asOf: greatest issuance at or before asOf that was captured (live) or public (archive) by then."""
  snapshot: ForecastSnapshot
  """Issuances known at asOf, newest first, at most `history`."""
  history: [ForecastSnapshot!]!
  """The first asOf with a forecast: when the earliest stored snapshot became knowable (archive rows at issuance, live rows when captured)."""
  replayCoverageStart: Time
  """First live capture by this process; before it every forecast is an archive copy."""
  liveCoverageStart: Time
  snapshotCount: Int!
}

"""An observed NWPS value (stage on the NWPS datum, the one the flood categories use)."""
type SiteObservation {
  observedAt: Time!
  ingestedAt: Time!
  source: ForecastSource!
  stageFt: Float
  flowKcfs: Float
}

type SiteConflict {
  """gauge_vs_forecast, stale_forecast, stale_observation or no_thresholds."""
  kind: String!
  detail: String!
  forecastFt: Float
  observedFt: Float
  """observed - forecast, feet."""
  differenceFt: Float
}

type SiteStatus {
  site: ID!
  asOf: Time!
  """Newest NWPS observation knowable at asOf."""
  observation: SiteObservation
  stageFt: Float
  """Category of the observed stage against the NWPS thresholds known at asOf."""
  category: FloodCategory
  thresholds: FloodThresholds
  observationFreshness: Freshness!
  forecastFreshness: Freshness!
  forecast: ForecastSnapshot
  """The forecast point valid nearest asOf (within 30 min), the one the gauge is compared to."""
  forecastNow: ForecastPoint
  conflicts: [SiteConflict!]!
  """NWS alert versions first seen at or before asOf and not ended by then."""
  activeAlerts: Int!
}

"""One forecast point against the observation nearest its valid time (within 30 min)."""
type ForecastVerifyPoint {
  validAt: Time!
  forecastFt: Float
  forecastCategory: FloodCategory
  observedAt: Time
  observedFt: Float
  observedCategory: FloodCategory
  """forecast - observed, feet. Null when either side is missing; never interpolated."""
  errorFt: Float
  missing: Boolean!
}

type ForecastVerification {
  site: ID!
  issuedAt: Time!
  snapshot: ForecastSnapshot!
  points: [ForecastVerifyPoint!]!
  paired: Int!
  missing: Int!
  """Mean of forecast - observed over paired points; positive = forecast ran high."""
  biasFt: Float
  meanAbsErrorFt: Float
  maxAbsErrorFt: Float
  peakForecastFt: Float
  peakForecastCategory: FloodCategory
  """Highest observed stage inside the forecast's valid window."""
  peakObservedFt: Float
  peakObservedCategory: FloodCategory
  """The observed peak reached the same category as the forecast peak. Null when either side is unknown."""
  peakCategoryHit: Boolean
}

type Query {
  feeds: [FeedState!]!
  sightings(bbox: BBox!, from: Time!, to: Time!, taxa: [ID!], quality: [Quality!]): [Sighting!]!
  """Taxa by id (or focus species name) and/or by a name fragment; at most 500."""
  taxa(ids: [ID!], q: String): [Taxon!]!
  """Top taxa by distinct sightings in a window, optionally limited to iconic groups; `top` defaults to 50."""
  speciesCounts(bbox: BBox!, from: Time!, to: Time!, groups: [String!], top: Int): [SpeciesCount!]!
  readings(bbox: BBox!, from: Time!, to: Time!, params: [Param!]): [Reading!]!
  alerts(bbox: BBox!, at: Time!): [Alert!]!
  frames(from: Time!, to: Time!, stepMinutes: Int!): FrameChunk!
  hotspots(species: ID!, at: Time!, bbox: BBox!, top: Int): HotspotGrid!
  explainCell(cell: ID!, species: ID!, at: Time!): HotspotExplain!
  backtest(species: ID!, days: Int!): Backtest!
  evidence(id: ID!): Evidence!
  board(id: ID!): Board!
  opsSince(boardId: ID!, seq: Int!): [Op!]!
  """The forecast known at asOf (default now) for a site, with the last `history` issuances known then (default 1, at most 60). Conditions apps only."""
  forecasts(site: ID!, asOf: Time, history: Int): ForecastView!
  """The issuance at issuedAt (newest revision) scored against the NWPS observations stored since. Conditions apps only."""
  forecastVerify(site: ID!, issuedAt: Time!): ForecastVerification!
  """What was known about a site at asOf; conflictFt (default 1) is the gauge-vs-forecast difference that counts as a conflict. Conditions apps only."""
  siteStatusAt(site: ID!, asOf: Time!, conflictFt: Float): SiteStatus!
}

type Mutation {
  applyOps(boardId: ID!, ops: [OpInput!]!): ApplyResult!
}

type Subscription {
  feeds: FeedState!
  framesUpdated: FrameRange!
  ops(boardId: ID!, afterSeq: Int!): Op!
}
