[package]
name = "inversa-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inversa-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-graphql = { version = "7", default-features = false }
async-graphql-axum = "7"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rayon = "1"
# rustls so the binary has no OpenSSL dependency on the Hetzner box.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# bundled = FTS5 + JSON1 compiled in.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# WebSocket client for the graphql-transport-ws end-to-end test; same version axum already pulls in.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
